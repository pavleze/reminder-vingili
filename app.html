.err-text { color: var(--error); font-size: 12.5px; margin-top: -8px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-md); padding: 12px 20px; font-weight: 600; font-size: 15px; line-height: 1.2; transition: transform .1s, filter .15s, background .15s; text-decoration: none; }

.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: inherit; flex: none; }

/* ---------- Shell ---------- */
#app { height: 100%; }

.rail { display: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 60px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));

.scroller { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.content {
  width: 100%; max-width: 1120px; margin: 0 auto; padding-block: 20px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

/* ---------- Common blocks ---------- */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 19px; font-weight: 700; }
.section-head .meta { color: var(--muted); }
.welcome {
  padding: 22px; border-radius: var(--r-xl);
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 16%, transparent), color-mix(in srgb, var(--primary) 5%, transparent));
  display: flex; align-items: center; gap: 18px;
}

  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: color-mix(in srgb, var(--fg) 62%, transparent);
}

/* Today card */
.today-card { display: flex; align-items: center; gap: 6px; padding: 10px 14px 10px 6px; border-radius: var(--r-md); background: var(--surface); border: 1px solid color-mix(in srgb, var(--outline) 45%, transparent); transition: border-color .2s, opacity .2s; }

.chip.neutral { background: var(--surface-2); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cat-tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 6px; min-height: 118px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); transition: transform .15s, box-shadow .15s; text-align: center; }
.cat-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.cat-tile span.lbl { font-weight: 500; font-size: 13.5px; line-height: 1.25; }
.cat-tile .count { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; font-size: 11.5px; font-weight: 600; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }

.cat-chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--outline) 60%, transparent); background: var(--surface); font-size: 14px; transition: background .2s, color .2s, box-shadow .2s; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .field { flex: 1; min-width: 200px; min-height: 46px; }
.toolbar .field input { padding: 10px 12px; }
