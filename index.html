/* Layout: app shell — side rail on desktop, top bar + bottom nav on phones; content column max 1120px.

:root {
  --bg: #f5faf6;
  --surface: #e9f3ec;
  --surface-2: #dbeae0;
  --card: #ffffff;
  --fg: #102018;
  --muted: #52675a;
  --outline: #bfd3c5;
  --divider: rgba(16, 48, 30, .10);
  --error: #d32f2f;
  --success: #2e7d32;

  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06);
  --scrim: rgba(10, 10, 12, .45);
  --brand-ink: #333333;
  --primary: #1E9E6A;
  --primary-ink: #157a51;
  --primary-strong: #13734c;
  --on-primary: #ffffff;
  --font: "Poppins", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
  --rail-w: 248px;
  color-scheme: light;
}

  :root:not([data-app-theme]):not([data-theme="light"]) {
    --bg: #08110c; --surface: #122019; --surface-2: #1c2e24; --card: #0e1913;
    --fg: #eaf5ee; --muted: #94ab9c; --outline: #34493c; --divider: rgba(200,255,220,.09);
    --error: #ef5350; --success: #66bb6a; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    --scrim: rgba(0,0,0,.65); --brand-ink: #f4f4f6; color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme]), :root[data-app-theme="dark"] {
  --bg: #08110c; --surface: #122019; --surface-2: #1c2e24; --card: #0e1913;
  --fg: #eaf5ee; --muted: #94ab9c; --outline: #34493c; --divider: rgba(200,255,220,.09);
  --error: #ef5350; --success: #66bb6a; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  --scrim: rgba(0,0,0,.65); --brand-ink: #f4f4f6; color-scheme: dark;
}
:root[data-app-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;

:focus-visible { outline: 2px solid var(--primary-ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.ms {
  font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px;
  line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
  direction: ltr; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga";
  font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; user-select: none; flex: none;
  width: 1em; height: 1em; overflow: hidden;

.ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
.ms.sm { font-size: 18px; } .ms.xs { font-size: 16px; } .ms.lg { font-size: 28px; } .ms.xl { font-size: 40px; } .ms.xxl { font-size: 60px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .35s ease;
}
.splash.out { opacity: 0; pointer-events: none; }
.splash-inner { width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; gap: 36px; }
.splash-logo { width: 100%; max-width: 420px; }
.progress { width: 100%; height: 8px; border-radius: 99px; background: #FFFDD0; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: #D45500; border-radius: inherit; transition: width .1s linear; }
.splash-dev { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
.splash-dev img { height: 96px; border-radius: 12px; background: #fff; padding: 4px; }

/* ---------- Auth ---------- */
.auth {
  min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--primary) 16%, var(--bg)) 50%, var(--bg) 100%);
}
.auth-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; animation: rise .5s ease both; }
.auth-logo { width: 78%; max-width: 300px; align-self: center; margin-bottom: 8px; }
.auth h1 { font-size: 28px; font-weight: 700; text-align: center; }
.auth .lead { text-align: center; color: var(--muted); margin: -8px 0 8px; }
.auth .row-end { display: flex; justify-content: flex-end; margin-top: -6px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--outline); }

.demo-hint { font-size: 12.5px; color: var(--muted); text-align: center; background: color-mix(in srgb, var(--primary) 9%, transparent); border-radius: var(--r-md); padding: 10px 12px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Fields (Material outlined) ---------- */
.field { position: relative; display: flex; align-items: center; border: 1px solid var(--outline); border-radius: var(--r-md); background: transparent; min-height: 52px; transition: border-color .15s; }

.field.primary-border { border-color: var(--primary-ink); }

.field:focus-within > label { color: var(--primary-ink); }
.field > .ms { margin-left: 14px; color: var(--primary-ink); }
.field input, .field select, .field textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 14px 14px; font-size: 15px; }
.field textarea { resize: vertical; min-height: 84px; }

.field select option { background: var(--card); color: var(--fg); }
.field .icon-btn { margin-right: 4px; }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field-row > * { min-width: 0; }
.err-text { color: var(--error); font-size: 12.5px; margin-top: -8px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-md); padding: 12px 20px; font-weight: 600; font-size: 15px; line-height: 1.2; transition: transform .1s, filter .15s, background .15s; text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 16px color-mix(in srgb, var(--primary) 35%, transparent); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-tonal { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary-ink); }
.btn-outline { background: transparent; border: 1.5px solid var(--primary-ink); color: var(--primary-ink); }
.btn-outline.danger { border-color: var(--error); color: var(--error); }
.btn-danger { background: var(--error); color: #fff; }
.btn-plain { background: var(--card); color: var(--fg); border: 1px solid var(--outline); }
.btn-text { background: none; color: var(--primary-ink); padding: 8px 12px; }
.btn-ink { background: var(--fg); color: var(--bg); }
.btn-block { width: 100%; min-height: 52px; }
.btn-sm { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--primary-ink); font-weight: 600; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: inherit; flex: none; }
.icon-btn:hover { background: color-mix(in srgb, currentColor 10%, transparent); }

/* ---------- Shell ---------- */
#app { height: 100%; }
.shell { display: flex; height: 100%; }
.rail { display: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 60px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: linear-gradient(120deg, var(--primary), var(--primary-strong)); color: var(--on-primary);
}
.topbar h1 { font-size: 20px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
.topbar .theme-btn { background: color-mix(in srgb, var(--on-primary) 14%, transparent); }
.topbar .avatar { width: 34px; height: 34px; font-size: 14px; border: 2px solid color-mix(in srgb, var(--on-primary) 60%, transparent); }
.scroller { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.content {
  width: 100%; max-width: 1120px; margin: 0 auto; padding-block: 20px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.content.narrow { max-width: 620px; }
.bottomnav {
  display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--divider);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.bottomnav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 10px; color: color-mix(in srgb, var(--fg) 60%, transparent); font-size: 12px; }
.bottomnav button .pill { display: grid; place-items: center; width: 56px; height: 32px; border-radius: 99px; transition: background .2s; }
.bottomnav button[aria-current="page"] { color: var(--primary-ink); font-weight: 600; }
.bottomnav button[aria-current="page"] .pill { background: color-mix(in srgb, var(--primary) 22%, transparent); }
.fabs { position: fixed; z-index: 6; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.fab { display: inline-flex; align-items: center; gap: 10px; height: 56px; min-width: 56px; padding: 0 16px; justify-content: center; border-radius: 16px; border: 0; background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 18px color-mix(in srgb, var(--primary) 40%, rgba(0,0,0,.25)); font-weight: 600; transition: transform .15s; }
.fab:hover { transform: translateY(-2px); }
.fab.secondary { background: var(--card); color: var(--primary-ink); border: 1px solid var(--outline); box-shadow: var(--shadow); height: 48px; min-width: 48px; border-radius: 14px; padding: 0 12px; }
.fab .fab-label { display: none; }

@media (min-width: 900px) {
  .rail {
    display: flex; flex-direction: column; width: var(--rail-w); flex: none; height: 100%; background: var(--surface);
    border-right: 1px solid var(--divider); padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); gap: 6px;
  }
  .rail-logo { padding: 4px 10px 22px; }
  .rail-logo img { width: 100%; max-width: 190px; display: block; }
  .rail button.nav { display: flex; align-items: center; gap: 14px; border: 0; background: none; padding: 12px 14px; border-radius: 99px; font-size: 15px; font-weight: 500; color: var(--fg); text-align: left; }
  .rail button.nav:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .rail button.nav[aria-current="page"] { background: color-mix(in srgb, var(--primary) 20%, transparent); color: var(--primary-ink); font-weight: 600; }
  .rail .spacer { flex: 1; }
  .rail .rail-user { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-lg); background: var(--card); border: 1px solid var(--divider); }
  .rail .rail-user div { min-width: 0; }
  .rail .rail-user b, .rail .rail-user small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .rail-user small { color: var(--muted); }
  .rail .rail-add { margin: 6px 0 14px; }
  .bottomnav { display: none; }
  .fabs { bottom: calc(28px + env(safe-area-inset-bottom, 0px)); right: calc(28px + env(safe-area-inset-right, 0px)); }
  .fab .fab-label { display: inline; }
  .fab.secondary .fab-label { display: inline; font-size: 13.5px; }
  .topbar { min-height: 64px; padding-left: 20px; }
}

/* ---------- Common blocks ---------- */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 19px; font-weight: 700; }
.section-head .meta { color: var(--muted); }
.welcome {
  padding: 22px; border-radius: var(--r-xl);
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 16%, transparent), color-mix(in srgb, var(--primary) 5%, transparent));
  display: flex; align-items: center; gap: 18px;
}
.welcome .txt { flex: 1; min-width: 0; }
.welcome h2 { font-size: 24px; font-weight: 700; }
.welcome p { margin: 6px 0 0; color: color-mix(in srgb, var(--fg) 70%, transparent); }
.ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--primary) calc(var(--p) * 1%), color-mix(in srgb, var(--primary) 16%, transparent) 0); }
.ring > div { width: 66px; height: 66px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring b { font-size: 18px; } .ring small { font-size: 10.5px; color: var(--muted); }
.home-grid { display: grid; gap: 22px; }
@media (min-width: 1000px) { .home-grid { grid-template-columns: 1.25fr 1fr; align-items: start; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.empty {
  width: 100%; padding: 26px 20px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--primary) 10%, transparent);
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: color-mix(in srgb, var(--fg) 62%, transparent);
}
.empty .ms { color: color-mix(in srgb, var(--primary-ink) 60%, transparent); }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); border: 1px dashed color-mix(in srgb, var(--primary-ink) 50%, transparent); color: var(--muted); font-size: 13px; }
.banner .ms { color: var(--primary-ink); }
.banner p { margin: 0; flex: 1; min-width: 0; }

/* Entries (tasks & lists) — minimal rows */
.day-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0 12px; border-bottom: 1px solid var(--divider); }
.day-head-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day-hero .greet { font-size: 16px; font-weight: 500; color: color-mix(in srgb, var(--fg) 75%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-hero .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day-hero h2 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.ring-min { width: 76px; height: 76px; background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--divider) 0); transition: background .3s; }
.ring-min > div { width: 68px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.ring-min b { font-size: 17px; font-weight: 700; }
.ring-min small { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rows { display: flex; flex-direction: column; }
.rows-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 18px 0 6px; }
.quiet { color: var(--muted); margin: 0; padding: 16px 0; }
.quiet.small { font-size: 12.5px; padding: 8px 0; }
.link-btn { background: none; border: 0; padding: 0; color: var(--primary-ink); font-weight: 500; font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }
.entry { border-bottom: 1px solid var(--divider); }
.entry:not(.list) { display: flex; align-items: center; gap: 14px; }
.entry-row { width: 100%; display: flex; align-items: center; gap: 14px; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.entry .body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; padding: 14px 0; text-align: left; color: inherit; }
.entry .title { font-size: 16px; font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; }
.entry .sub { font-size: 12.5px; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .time { font-size: 13.5px; color: var(--muted); flex: none; }
.entry.done .title { text-decoration: line-through; color: var(--muted); }
.tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--fg) 35%, transparent); background: transparent; display: grid; place-items: center; padding: 0; color: var(--on-primary); transition: background .15s, border-color .15s; }
.tick:hover { border-color: var(--primary-ink); }
.tick.on { background: var(--primary); border-color: var(--primary); }
.list-tick { border-radius: 7px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.list-tick.on { color: var(--on-primary); }
.name-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 150px); gap: 10px; }
.name-row:has(#ef-type-wrap[hidden]) { grid-template-columns: minmax(0, 1fr); }
.ev-ic { flex: none; width: 24px; height: 24px; display: grid; place-items: center; color: #9B6BD6; }
.entry.event.past .title, .entry.event.past .time { color: var(--muted); }
.chev { color: var(--muted); display: grid; place-items: center; flex: none; }
.star { color: var(--star); display: inline-grid; }
.entry-items { padding: 0 0 10px 38px; display: flex; flex-direction: column; align-items: flex-start; animation: open .2s ease; }
@keyframes open { from { opacity: 0; transform: translateY(-4px); } }
.entry-desc { margin: 0 0 4px; color: var(--muted); font-size: 13.5px; white-space: pre-wrap; }
.item-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; font-size: 15px; }
.item-row input { width: 18px; height: 18px; accent-color: var(--primary); flex: none; margin: 0; }
.item-row.bullet { cursor: default; }
.item-row.bullet::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; margin: 0 6px; }
